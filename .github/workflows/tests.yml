name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout event SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked-out source identity
        id: source
        shell: bash
        run: |
          event_name='${{ github.event_name }}'
          if [ "$event_name" = "pull_request" ]; then
            expected='${{ github.event.pull_request.head.sha }}'
          else
            expected='${{ github.sha }}'
          fi
          if [ -z "$expected" ]; then
            echo "::error::expected source SHA is missing"
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked-out source SHA does not match the event source"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checked-out source tree is not clean"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Verified source SHA: $actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r examples/livekit_agents/requirements-pinned.txt

      - name: Install code quality tools
        run: pip install ruff==0.15.22 black==26.3.1 mypy==2.3.0

      - name: Run ruff
        run: ruff check core/ routes/ proxy.py

      - name: Run black
        run: black --check --target-version py312 core/ routes/ proxy.py

      - name: Run mypy
        run: mypy core/ routes/ --ignore-missing-imports

      - name: Compile backend
        run: python -m compileall proxy.py core routes models tests

      # Whole-directory run so new test files can never silently go unrun.
      # tests/test_db.py and tests/test_mcp_db.py are script-style (module-level
      # asserts); pytest executes them at collection import, so an assertion
      # failure in either still fails this step.
      # -ra prints the reason for every skip/xfail in the job log.
      - name: Run backend tests (entire tests/ directory)
        run: python -m pytest tests/ -q -ra

  postgres-security:
    name: PostgreSQL security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: python:3.12.9-bookworm@sha256:551c386b532bd5c9a3d84809ebc7d9052771d22c9edb1ccaab0df7307b7bb9e0
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: interlock_test
          POSTGRES_PASSWORD: interlock_ci_disposable_only
          POSTGRES_DB: interlock_test
        options: >-
          --health-cmd "pg_isready -U interlock_test -d interlock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # Pull-request workflows default to a synthetic merge ref. These two
      # explicit paths make the tested source identity auditable.
      - name: Checkout pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout event SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out source identity
        id: source
        run: |
          event_name='${{ github.event_name }}'
          if [ "$event_name" = "pull_request" ]; then
            expected='${{ github.event.pull_request.head.sha }}'
          else
            expected='${{ github.sha }}'
          fi
          if [ -z "$expected" ]; then
            echo "::error::expected source SHA is missing"
            exit 1
          fi
          # checkout's safe-directory setting is made with a temporary HOME;
          # register only this job's exact workspace for subsequent git reads.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked-out source SHA does not match the event source"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checked-out source tree is not clean"
            exit 1
          fi
          run_nonce='${{ github.run_id }}-${{ github.run_attempt }}-'"$actual"
          session_token="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$session_token"
          evidence_dir="postgres-security-evidence-$actual-${{ github.run_id }}-${{ github.run_attempt }}"
          if [ -e "$evidence_dir" ]; then
            echo "::error::fresh evidence directory already exists"
            exit 1
          fi
          mkdir "$evidence_dir"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "run_nonce=$run_nonce" >> "$GITHUB_OUTPUT"
          echo "session_token=$session_token" >> "$GITHUB_OUTPUT"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "Verified source SHA: $actual"

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authorize disposable PostgreSQL session
        id: authorize
        env: &postgres-test-env
          INTERLOCK_TEST_DATABASE_URL: postgresql://interlock_test:interlock_ci_disposable_only@postgres:5432/interlock_test
          INTERLOCK_ALLOW_DESTRUCTIVE_TEST_DATABASE: interlock-disposable-only
          INTERLOCK_DESTRUCTIVE_TEST_RUN_ID: ${{ steps.source.outputs.run_nonce }}
          INTERLOCK_DESTRUCTIVE_TEST_SESSION_TOKEN: ${{ steps.source.outputs.session_token }}
        run: python -m scripts.postgres_test_database prepare

      - name: Collect PostgreSQL security manifest
        run: >-
          python -m scripts.collect_postgres_security_manifest
          --output ${{ steps.source.outputs.evidence_dir }}/collection-manifest.json
          --source-sha ${{ steps.source.outputs.sha }}
          --run-nonce ${{ steps.source.outputs.run_nonce }}

      # These fixtures call core.db.init_db(), the repository's authoritative
      # idempotent schema initializer. Destructive SQL is guarded by the exact
      # disposable database identity and fresh session marker above.
      - name: Run PostgreSQL security cases
        env: *postgres-test-env
        run: >-
          python -m scripts.run_postgres_security_tests
          --manifest ${{ steps.source.outputs.evidence_dir }}/collection-manifest.json
          --junit ${{ steps.source.outputs.evidence_dir }}/postgres-security-junit.xml
          --execution ${{ steps.source.outputs.evidence_dir }}/execution.json
          --source-sha ${{ steps.source.outputs.sha }}
          --run-nonce ${{ steps.source.outputs.run_nonce }}

      # Compare actual testcase records to the exact same-source collection;
      # top-level JUnit counts alone are never accepted as execution proof.
      - name: Prove PostgreSQL cases executed
        run: >-
          python -m scripts.verify_postgres_security_junit
          --manifest ${{ steps.source.outputs.evidence_dir }}/collection-manifest.json
          --junit ${{ steps.source.outputs.evidence_dir }}/postgres-security-junit.xml
          --execution ${{ steps.source.outputs.evidence_dir }}/execution.json
          --source-sha ${{ steps.source.outputs.sha }}
          --run-nonce ${{ steps.source.outputs.run_nonce }}

      - name: Verify PostgreSQL cleanup
        if: always() && steps.source.outcome == 'success' && steps.authorize.outcome == 'success'
        env: *postgres-test-env
        run: python -m scripts.postgres_test_database verify-clean

      - name: Clear disposable PostgreSQL session marker
        if: always() && steps.source.outcome == 'success' && steps.authorize.outcome == 'success'
        env: *postgres-test-env
        run: python -m scripts.postgres_test_database clear

      - name: Upload PostgreSQL security report
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-security-${{ steps.source.outputs.sha }}
          path: ${{ steps.source.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

  phase2-docker:
    name: Docker Phase 2 egress profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout event SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out source identity
        id: source
        shell: bash
        run: |
          event_name='${{ github.event_name }}'
          if [ "$event_name" = "pull_request" ]; then
            expected='${{ github.event.pull_request.head.sha }}'
          else
            expected='${{ github.sha }}'
          fi
          if [ -z "$expected" ]; then
            echo "::error::expected source SHA is missing"
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked-out source SHA does not match the event source"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checked-out source tree is not clean"
            exit 1
          fi
          evidence_dir="phase2-docker-evidence-$actual-${{ github.run_id }}-${{ github.run_attempt }}"
          if [ -e "$evidence_dir" ]; then
            echo "::error::fresh evidence directory already exists"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "Verified source SHA: $actual"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Docker Phase 2 acceptance
        id: acceptance
        shell: bash
        run: >-
          python scripts/run_phase2_docker_acceptance.py
          --output "${{ steps.source.outputs.evidence_dir }}"
          --source-sha "${{ steps.source.outputs.sha }}"

      - name: Re-verify retained Phase 2 evidence
        id: evidence
        shell: bash
        run: >-
          python scripts/verify_phase2_docker_evidence.py
          "${{ steps.source.outputs.evidence_dir }}"

      - name: Upload Docker Phase 2 evidence
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phase2-docker-${{ steps.source.outputs.sha }}
          path: ${{ steps.source.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

  kubernetes-enforcement:
    name: Kubernetes enforcement reference profile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout event SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out source identity
        id: source
        shell: bash
        run: |
          event_name='${{ github.event_name }}'
          if [ "$event_name" = "pull_request" ]; then
            expected='${{ github.event.pull_request.head.sha }}'
          else
            expected='${{ github.sha }}'
          fi
          if [ -z "$expected" ]; then
            echo "::error::expected source SHA is missing"
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked-out source SHA does not match the event source"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checked-out source tree is not clean"
            exit 1
          fi
          evidence_dir="kubernetes-enforcement-evidence-$actual-${{ github.run_id }}-${{ github.run_attempt }}"
          if [ -e "$evidence_dir" ]; then
            echo "::error::fresh evidence directory already exists"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "Verified source SHA: $actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependencies
        run: pip install -r requirements.txt

      - name: Run disposable kind enforcement acceptance
        run: >-
          python scripts/run_kubernetes_enforcement_acceptance.py
          --output "${{ steps.source.outputs.evidence_dir }}"
          --source-sha "${{ steps.source.outputs.sha }}"

      - name: Re-verify retained enforcement evidence
        run: >-
          python scripts/verify_kubernetes_enforcement_evidence.py
          "${{ steps.source.outputs.evidence_dir }}/report.json"
          --source-sha "${{ steps.source.outputs.sha }}"

      - name: Upload enforcement evidence
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-enforcement-${{ steps.source.outputs.sha }}
          path: ${{ steps.source.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout event SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out source identity
        id: source
        shell: bash
        run: |
          event_name='${{ github.event_name }}'
          if [ "$event_name" = "pull_request" ]; then
            expected='${{ github.event.pull_request.head.sha }}'
          else
            expected='${{ github.sha }}'
          fi
          if [ -z "$expected" ]; then
            echo "::error::expected source SHA is missing"
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked-out source SHA does not match the event source"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checked-out source tree is not clean"
            exit 1
          fi
          evidence_dir="dependency-audit-evidence-$actual-${{ github.run_id }}-${{ github.run_attempt }}"
          if [ -e "$evidence_dir" ]; then
            echo "::error::fresh evidence directory already exists"
            exit 1
          fi
          mkdir "$evidence_dir"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "Verified source SHA: $actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: interlock-web/package-lock.json

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r examples/livekit_agents/requirements-pinned.txt pip-audit

      # Each ecosystem is audited independently: a Python advisory must not stop
      # the npm gates from running and reporting, and vice versa. Every audit
      # step therefore runs with `if: always()` and records its own outcome id,
      # and a final step fails the job if ANY of them failed. No step uses
      # continue-on-error, `|| true`, or any other exit-swallowing construct.
      - name: Audit Python dependencies (pip-audit, blocking)
        id: pip_audit
        if: always()
        run: pip-audit --progress-spinner off

      - name: Record Python audit JSON
        id: pip_audit_json
        if: always()
        run: >-
          pip-audit --progress-spinner off --format=json
          --output ${{ steps.source.outputs.evidence_dir }}/pip-audit-${{ steps.source.outputs.sha }}.json

      - name: Install frontend dependencies
        id: npm_install
        if: always()
        working-directory: interlock-web
        run: npm ci

      # The gate runs `npm audit` itself, so no shell redirect needs `|| true`
      # to survive npm's non-zero "found something" exit. Production is the
      # --omit=dev tree; development is the full tree minus production, so a
      # production advisory can never be relabelled as a build-only finding.
      - name: Gate production dependencies (npm audit --omit=dev, blocking)
        id: npm_production
        if: always()
        run: >-
          python scripts/audit_npm.py
          --npm-dir interlock-web
          --scope production
          --write ${{ steps.source.outputs.evidence_dir }}/npm-audit-production-${{ steps.source.outputs.sha }}.json

      - name: Gate build/development dependencies (blocking)
        id: npm_development
        if: always()
        run: >-
          python scripts/audit_npm.py
          --npm-dir interlock-web
          --scope development
          --write ${{ steps.source.outputs.evidence_dir }}/npm-audit-all-${{ steps.source.outputs.sha }}.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ steps.source.outputs.sha }}
          path: ${{ steps.source.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 30

      # Single authoritative verdict. Any failed or skipped audit fails the job,
      # so running the ecosystems independently never softens the result.
      - name: Dependency audit verdict
        if: always()
        env:
          PIP_AUDIT: ${{ steps.pip_audit.outcome }}
          PIP_AUDIT_JSON: ${{ steps.pip_audit_json.outcome }}
          NPM_INSTALL: ${{ steps.npm_install.outcome }}
          NPM_PRODUCTION: ${{ steps.npm_production.outcome }}
          NPM_DEVELOPMENT: ${{ steps.npm_development.outcome }}
        run: |
          failed=0
          for name in PIP_AUDIT PIP_AUDIT_JSON NPM_INSTALL NPM_PRODUCTION NPM_DEVELOPMENT; do
            outcome="${!name}"
            printf '%-16s %s\n' "$name" "$outcome"
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::dependency audit failed in at least one ecosystem"
            exit 1
          fi
          echo "all dependency audits passed"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout event SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked-out source identity
        id: source
        shell: bash
        run: |
          event_name='${{ github.event_name }}'
          if [ "$event_name" = "pull_request" ]; then
            expected='${{ github.event.pull_request.head.sha }}'
          else
            expected='${{ github.sha }}'
          fi
          if [ -z "$expected" ]; then
            echo "::error::expected source SHA is missing"
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
