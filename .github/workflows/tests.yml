            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checked-out source tree is not clean"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Verified source SHA: $actual"

      # Scans the commits introduced by the push/PR. Known historical findings
      # (all triaged as demo/test placeholder values) do not re-trigger.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interlock-web
    steps:
      - name: Checkout pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout event SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out source identity
        id: source
        shell: bash
        run: |
          event_name='${{ github.event_name }}'
          if [ "$event_name" = "pull_request" ]; then
            expected='${{ github.event.pull_request.head.sha }}'
          else
            expected='${{ github.sha }}'
          fi
          if [ -z "$expected" ]; then
            echo "::error::expected source SHA is missing"
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked-out source SHA does not match the event source"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checked-out source tree is not clean"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Verified source SHA: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: interlock-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build dashboard and landing page
        run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout event SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out source identity
        id: source
        shell: bash
        run: |
          event_name='${{ github.event_name }}'
          if [ "$event_name" = "pull_request" ]; then
            expected='${{ github.event.pull_request.head.sha }}'
          else
            expected='${{ github.sha }}'
          fi
          if [ -z "$expected" ]; then
            echo "::error::expected source SHA is missing"
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked-out source SHA does not match the event source"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checked-out source tree is not clean"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Verified source SHA: $actual"

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.0

      - name: Lint chart
        run: helm lint ./helm

      - name: Render production values
        run: helm template interlock ./helm -f ./helm/values-production.example.yaml

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout event SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out source identity
        id: source
        shell: bash
        run: |
          event_name='${{ github.event_name }}'
          if [ "$event_name" = "pull_request" ]; then
            expected='${{ github.event.pull_request.head.sha }}'
          else
            expected='${{ github.sha }}'
          fi
          if [ -z "$expected" ]; then
            echo "::error::expected source SHA is missing"
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked-out source SHA does not match the event source"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checked-out source tree is not clean"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Verified source SHA: $actual"

      - name: Build runtime image
        run: docker build -t interlock:${{ steps.source.outputs.sha }} .
