name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r examples/livekit_agents/requirements-pinned.txt

      - name: Install code quality tools
        run: pip install ruff==0.15.22 black==26.3.1 mypy==2.3.0

      - name: Run ruff
        run: ruff check core/ routes/ proxy.py

      - name: Run black
        run: black --check --target-version py312 core/ routes/ proxy.py

      - name: Run mypy
        run: mypy core/ routes/ --ignore-missing-imports

      - name: Compile backend
        run: python -m compileall proxy.py core routes models tests

      # Whole-directory run so new test files can never silently go unrun.
      # tests/test_db.py and tests/test_mcp_db.py are script-style (module-level
      # asserts); pytest executes them at collection import, so an assertion
      # failure in either still fails this step.
      # -ra prints the reason for every skip/xfail in the job log.
      - name: Run backend tests (entire tests/ directory)
        run: python -m pytest tests/ -q -ra

  postgres-security:
    name: PostgreSQL security tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: python:3.12.9-bookworm@sha256:551c386b532bd5c9a3d84809ebc7d9052771d22c9edb1ccaab0df7307b7bb9e0
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: interlock_ci
          POSTGRES_PASSWORD: interlock_ci_disposable_only
          POSTGRES_DB: interlock_ci
        options: >-
          --health-cmd "pg_isready -U interlock_ci -d interlock_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # These fixtures call core.db.init_db(), the repository's authoritative
      # idempotent schema initializer. The URL is intentionally scoped to this
      # one pytest process and names only the job-local service-network host.
      - name: Run PostgreSQL security cases
        env:
          INTERLOCK_TEST_DATABASE_URL: postgresql://interlock_ci:interlock_ci_disposable_only@postgres:5432/interlock_ci
        run: >-
          python -m pytest
          tests/test_postgres_rebaseline_cas.py
          tests/test_postgres_ci_boundary_review_gate.py
          tests/test_audit_chain_concurrency.py
          -q -ra --tb=short
          --junitxml=postgres-security-junit.xml

      # Pytest returns zero when every selected case skips. Verify the JUnit
      # model instead of parsing console prose, and require named CAS/locking/
      # rollback/receipt cases plus zero skips, failures, or errors.
      - name: Prove PostgreSQL cases executed
        run: >-
          python scripts/verify_postgres_security_junit.py
          postgres-security-junit.xml

      - name: Upload PostgreSQL security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-security-${{ github.sha }}
          path: postgres-security-junit.xml
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: interlock-web/package-lock.json

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r examples/livekit_agents/requirements-pinned.txt pip-audit

      # Each ecosystem is audited independently: a Python advisory must not stop
      # the npm gates from running and reporting, and vice versa. Every audit
      # step therefore runs with `if: always()` and records its own outcome id,
      # and a final step fails the job if ANY of them failed. No step uses
      # continue-on-error, `|| true`, or any other exit-swallowing construct.
      - name: Audit Python dependencies (pip-audit, blocking)
        id: pip_audit
        if: always()
        run: pip-audit --progress-spinner off

      - name: Record Python audit JSON
        id: pip_audit_json
        if: always()
        run: pip-audit --progress-spinner off --format=json --output pip-audit.json

      - name: Install frontend dependencies
        id: npm_install
        if: always()
        working-directory: interlock-web
        run: npm ci

      # The gate runs `npm audit` itself, so no shell redirect needs `|| true`
      # to survive npm's non-zero "found something" exit. Production is the
      # --omit=dev tree; development is the full tree minus production, so a
      # production advisory can never be relabelled as a build-only finding.
      - name: Gate production dependencies (npm audit --omit=dev, blocking)
        id: npm_production
        if: always()
        run: >-
          python scripts/audit_npm.py
          --npm-dir interlock-web
          --scope production
          --write interlock-web/npm-audit-production.json

      - name: Gate build/development dependencies (blocking)
        id: npm_development
        if: always()
        run: >-
          python scripts/audit_npm.py
          --npm-dir interlock-web
          --scope development
          --write interlock-web/npm-audit-all.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            pip-audit.json
            interlock-web/npm-audit-production.json
            interlock-web/npm-audit-all.json
          if-no-files-found: warn
          retention-days: 30

      # Single authoritative verdict. Any failed or skipped audit fails the job,
      # so running the ecosystems independently never softens the result.
      - name: Dependency audit verdict
        if: always()
        env:
          PIP_AUDIT: ${{ steps.pip_audit.outcome }}
          PIP_AUDIT_JSON: ${{ steps.pip_audit_json.outcome }}
          NPM_INSTALL: ${{ steps.npm_install.outcome }}
          NPM_PRODUCTION: ${{ steps.npm_production.outcome }}
          NPM_DEVELOPMENT: ${{ steps.npm_development.outcome }}
        run: |
          failed=0
          for name in PIP_AUDIT PIP_AUDIT_JSON NPM_INSTALL NPM_PRODUCTION NPM_DEVELOPMENT; do
            outcome="${!name}"
            printf '%-16s %s\n' "$name" "$outcome"
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::dependency audit failed in at least one ecosystem"
            exit 1
          fi
          echo "all dependency audits passed"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans the commits introduced by the push/PR. Known historical findings
      # (all triaged as demo/test placeholder values) do not re-trigger.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interlock-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: interlock-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build dashboard and landing page
        run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.0

      - name: Lint chart
        run: helm lint ./helm

      - name: Render production values
        run: helm template interlock ./helm -f ./helm/values-production.example.yaml

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t interlock:ci .
