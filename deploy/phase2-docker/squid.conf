http_port 3128
visible_hostname interlock-phase2-reference-proxy

acl phase2_clients src 172.31.250.0/24 fd00:1:2:3::/64
acl CONNECT method CONNECT
acl allowed_methods method GET HEAD POST CONNECT
acl allowed_ports port 80 443 8080 8443
acl tls_ports port 443 8443
acl allowed_protocols proto HTTP HTTPS
acl allowed_domains dstdomain -n "/etc/squid/allowed-domains.txt"
acl proxy_credentials req_header Proxy-Authorization .+

# Fail closed for non-global and special-use destinations. A destination ACL
# matches if any address in Squid's cached A/AAAA set matches. Raw numeric
# targets are independently rejected by the hostname allowlist above.
acl denied_destination dst 0.0.0.0/8
acl denied_destination dst 10.0.0.0/8
acl denied_destination dst 100.64.0.0/10
acl denied_destination dst 127.0.0.0/8
acl denied_destination dst 169.254.0.0/16
acl denied_destination dst 172.16.0.0/12
acl denied_destination dst 192.0.0.0/24
acl denied_destination dst 192.0.2.0/24
acl denied_destination dst 192.31.196.0/24
acl denied_destination dst 192.52.193.0/24
acl denied_destination dst 192.88.99.0/24
acl denied_destination dst 192.168.0.0/16
acl denied_destination dst 192.175.48.0/24
acl denied_destination dst 198.18.0.0/15
acl denied_destination dst 198.51.100.0/24
acl denied_destination dst 203.0.113.0/24
acl denied_destination dst 224.0.0.0/4
acl denied_destination dst 240.0.0.0/4
acl denied_destination dst ::/128
acl denied_destination dst ::1/128
acl denied_destination dst 64:ff9b::/96
acl denied_destination dst 64:ff9b:1::/48
acl denied_destination dst 100::/64
acl denied_destination dst 2001::/23
acl denied_destination dst 2002::/16
acl denied_destination dst 3fff::/20
acl denied_destination dst 5f00::/16
acl denied_destination dst fc00::/7
acl denied_destination dst fe80::/10
acl denied_destination dst ff00::/8

http_access deny !phase2_clients
http_access deny proxy_credentials
http_access deny !allowed_methods
http_access deny CONNECT !tls_ports
http_access deny !CONNECT !allowed_protocols
http_access deny !allowed_ports
http_access deny !allowed_domains
http_access deny denied_destination
http_access allow phase2_clients
http_access deny all

dns_nameservers 172.31.250.53
dns_timeout 2 seconds
dns_retransmit_interval 200 milliseconds
positive_dns_ttl 60 seconds
negative_dns_ttl 5 seconds
ipcache_size 4096

forward_max_tries 1
connect_retries 0
connect_timeout 3 seconds
forward_timeout 15 seconds
server_persistent_connections off
client_persistent_connections off
pconn_lifetime 1 seconds

cache deny all
cache_mem 0 MB
coredump_dir /tmp
pid_filename /run/squid.pid

forwarded_for delete
request_header_access Proxy-Authorization deny all

# Numeric upstream logging deliberately omits hostnames, URLs, query strings,
# headers, bodies, and CONNECT payload data. Via remains enabled by default.
logformat interlock_phase2_safe %ts.%03tu %>a %rm %Ss/%03>Hs %<a:%<p
access_log stdio:/dev/stdout interlock_phase2_safe
cache_log /dev/stderr
